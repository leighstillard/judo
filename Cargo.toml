[workspace]
resolver = "2"
members = [
    "crates/judo",
    "crates/judo-proto",
    "crates/judo-relay",
    "crates/judo-sudo-plugin",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
futures-util = "0.3"
base64 = "0.22"
ulid = "1"
